# Copy into a plugin repo as .github/workflows/claude.yml.
name: Claude Issue

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    uses: Miller-Media/wordpress-plugin-tests/.github/workflows/claude-issue.yml@main
    secrets: inherit
