# Copy into a plugin repo as .github/dependabot.yml.
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'

  # Uncomment only if this plugin has its own composer.json (none do today):
  # - package-ecosystem: 'composer'
  #   directory: '/'
  #   schedule:
  #     interval: 'weekly'

  # protect-the-children has a package.json — uncomment there (and nowhere
  # else, since no other plugin ships JS tooling):
  # - package-ecosystem: 'npm'
  #   directory: '/'
  #   schedule:
  #     interval: 'weekly'
