services:
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
        WP_VERSION: ${WP_VERSION:-7.1}
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      # WP_VERSION is deliberately NOT set here — see the Dockerfile note.
      # tests/bootstrap.php resolves the test library version by reading
      # the core actually installed at WP_CORE_DIR (default /var/www/html).
    # Per-plugin mounts live in docker/docker-compose.plugins.yml, generated
    # from plugins.json by `make compose` (run automatically by `make start`).
    volumes:
      # Mount tests directory
      - ../tests:/var/www/tests
      # Mount phpcs config
      - ../phpcs.xml:/var/www/phpcs.xml
      # Mount the manifest + CLI so the entrypoint can activate plugins
      # without a hardcoded list (see docker-entrypoint-custom.sh)
      - ../plugins.json:/var/www/plugins.json
      - ../bin:/var/www/bin
    depends_on:
      db:
        condition: service_healthy
    # No explicit `networks:` — these three services share Compose's
    # implicit per-project default network, which already gives them
    # name-based discovery (db, db-test, wordpress). Leaving it implicit
    # (rather than a named custom network) is what lets
    # docker-compose.host-network.yml add `network_mode: host` on top
    # without an explicit `networks:` key to conflict with it.

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Separate database for tests so they don't interfere with the dev site
  db-test:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wordpress_test
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
