services:
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.2}
        WP_VERSION: ${WP_VERSION:-7.1}
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
    # Per-plugin mounts live in docker/docker-compose.plugins.yml, generated
    # from plugins.json by `make compose` (run automatically by `make start`).
    volumes:
      # Mount tests directory
      - ../tests:/var/www/tests
      # Mount phpcs config
      - ../phpcs.xml:/var/www/phpcs.xml
      # Mount the manifest + CLI so the entrypoint can activate plugins
      # without a hardcoded list (see docker-entrypoint-custom.sh)
      - ../plugins.json:/var/www/plugins.json
      - ../bin:/var/www/bin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - wp-test

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wp-test

  # Separate database for tests so they don't interfere with the dev site
  db-test:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wordpress_test
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wp-test

volumes:
  db_data:

networks:
  wp-test:
